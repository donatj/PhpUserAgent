name: Benchmark

on:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Parser benchmark
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix
          coverage: none

      - name: Install Tally
        run: composer require --dev phpstan/tally:1.0.1 --no-interaction --no-progress

      - name: Run benchmarks
        run: vendor/bin/tally run --output=tmp/tally-results

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-results
          path: tmp/tally-results
          if-no-files-found: ignore
