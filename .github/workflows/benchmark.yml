name: Benchmark

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Parser benchmark
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix
          coverage: none

      - name: Install Tally
        run: composer require --dev phpstan/tally:1.0.1 --no-interaction --no-progress

      - name: Measure base and PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          parser_backup=$(mktemp)
          cp src/UserAgentParser.php "$parser_backup"
          trap 'cp "$parser_backup" src/UserAgentParser.php; rm -f "$parser_backup"' EXIT

          git show "${BASE_SHA}:src/UserAgentParser.php" > src/UserAgentParser.php
          env -u GITHUB_ACTIONS vendor/bin/tally run --output=tmp/tally-base

          cp "$parser_backup" src/UserAgentParser.php
          env -u GITHUB_ACTIONS vendor/bin/tally run --output=tmp/tally-head

      - name: Comment benchmark results
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            function readResult(directory) {
              const files = fs.readdirSync(directory).filter((file) => file.endsWith('.json'))
              if (files.length !== 1) {
                throw new Error(`Expected one Tally result in ${directory}, found ${files.length}`)
              }
              return JSON.parse(fs.readFileSync(path.join(directory, files[0]), 'utf8'))
            }

            const base = readResult('tmp/tally-base')
            const head = readResult('tmp/tally-head')
            if (base.id !== head.id || base.id !== 'ParserBench::benchParseUserAgents') {
              throw new Error('Tally results do not match the parser benchmark')
            }

            const metrics = [
              ['Instructions', 'instructions'],
              ['Simulated cycles', 'cycles'],
              ['Memory (bytes)', 'memory'],
            ]
            const format = (number) => number.toLocaleString('en-US')
            const rows = metrics.map(([label, key]) => {
              const before = base.metrics?.[key]
              const after = head.metrics?.[key]
              if (!Number.isSafeInteger(before) || before < 0 || !Number.isSafeInteger(after) || after < 0) {
                throw new Error(`Missing or invalid Tally metric: ${key}`)
              }
              const delta = after - before
              const percent = before === 0 ? 'n/a' : `${delta >= 0 ? '+' : ''}${(delta / before * 100).toFixed(2)}%`
              return `| ${label} | ${format(before)} | ${format(after)} | ${delta >= 0 ? '+' : ''}${format(delta)} (${percent}) |`
            })

            const marker = '<!-- benchmark-results -->'
            const pullRequest = context.payload.pull_request
            const body = `${marker}
            ## Benchmark Results

            Tally measures work under CPU simulation. Cycles are estimates; these values are not elapsed time.

            | Metric | Before (base) | After (PR) | Delta |
            | --- | ---: | ---: | ---: |
            ${rows.join('\n')}

            Run for ${pullRequest.head.sha.slice(0, 7)} vs ${pullRequest.base.sha.slice(0, 7)} ${pullRequest.base.ref}
            `

            await core.summary.addRaw(body).write()

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-results
          path: |
            tmp/tally-base
            tmp/tally-head
          if-no-files-found: ignore
